<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>🎵 Meu Player</h1>

        <section id="auth">
            <input id="email" type="email" placeholder="Seu e-mail">
            <input id="password" type="password" placeholder="Sua senha">

            <button id="login">Entrar</button>
            <button id="signup">Criar conta</button>
        </section>

        <section id="library" hidden>

            <h2>Minhas músicas</h2>

            <input id="musicFile" type="file" accept="audio/*">

            <button id="upload">
                ＋ Adicionar música
            </button>

            <div id="songs"></div>

            <button id="logout">
                Sair
            </button>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
