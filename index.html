<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="logo">
            🎵
        </div>

        <h1>Meu Player</h1>
        <p class="subtitle">Sua música, do seu jeito.</p>

        <div id="message"></div>

        <div id="auth">

            <input
                id="email"
                type="email"
                placeholder="Seu e-mail"
                autocomplete="email"
            >

            <input
                id="password"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Entrar
            </button>

            <button id="signupButton" class="secondary">
                Criar conta
            </button>

        </div>

        <div id="library" hidden>

            <h2>Minha biblioteca 🎧</h2>

            <p id="userEmail"></p>

            <input
                id="musicFile"
                type="file"
                accept="audio/*"
            >

            <button id="uploadButton">
                ＋ Adicionar música
            </button>

            <div id="songs"></div>

            <button id="logoutButton" class="logout">
                Sair
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
